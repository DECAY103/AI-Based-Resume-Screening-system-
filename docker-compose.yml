services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resume_screening
      POSTGRES_USER: resume
      POSTGRES_PASSWORD: resume_local_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://resume:resume_local_only@db:5432/resume_screening
      JWT_SECRET: replace-with-a-long-random-value
      LLM_PROVIDER: heuristic
      COOKIE_SECURE: "false"
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      - db
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://backend:8000
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
volumes:
  postgres_data:
